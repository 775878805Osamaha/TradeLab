name: tradelab_flutter
description: TradeLab Flutter interface migration — independent UI preview, without broker execution.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.3.0
  crypto: ^3.0.6
  app_links: ^7.0.0
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  sqflite: ^2.4.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # SQLite backend for deterministic desktop unit tests of the Android cache.
  sqflite_common_ffi: ^2.3.7

flutter:
  uses-material-design: true
