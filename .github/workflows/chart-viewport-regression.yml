name: Android Chart Viewport Regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/chart-viewport-regression.yml'
      - 'app/src/main/java/com/example/ui/components/**'
      - 'app/src/main/java/com/example/feature/chart/**'
      - 'app/src/androidTest/java/com/example/LargeChartInteractionTest.kt'
  workflow_dispatch:

jobs:
  viewport:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator"
      - name: Prepare Android debug signing
        run: |
          if [ -f debug.keystore.base64 ]; then base64 -d debug.keystore.base64 > debug.keystore || true; fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Verify hardware acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Verify Heikin Ashi viewport continuity through style and history changes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.example.LargeChartInteractionTest#heikinAshiLargeHistoryRemainsPannableAfterStyleAndSourceChanges' --stacktrace
      - name: Preserve viewport test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-viewport-regression-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
