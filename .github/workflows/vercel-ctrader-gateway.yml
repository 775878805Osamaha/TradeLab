name: Vercel cTrader Gateway Checks
on:
  push:
    branches: [feat/chart-gesture-stability-20261031]
    paths:
      - "vercel-gateway/**"
      - ".github/workflows/vercel-ctrader-gateway.yml"
  pull_request:
    paths:
      - "vercel-gateway/**"
      - ".github/workflows/vercel-ctrader-gateway.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
