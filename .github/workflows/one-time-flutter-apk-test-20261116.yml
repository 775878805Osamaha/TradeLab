name: One-time TradeLab Flutter APK test — 2026-11-16
# Explicit one-time user-requested build; never runs for main or general PRs.
on:
  push:
    branches:
      - testing/flutter-apk-20261116

permissions:
  contents: write
  statuses: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate isolated Flutter Android host
        run: flutter create --platforms android --project-name tradelab_flutter . --no-pub
      - name: Configure isolated Flutter OAuth callback and INTERNET permission
        run: python3 tool/configure_android_host.py
      - name: Fetch Flutter packages
        run: flutter pub get
      - name: Verify Flutter source (informational lint does not fail build)
        run: flutter analyze --no-fatal-infos
      - name: Work around upstream url_launcher_android release JavaDoc lint crash only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          deps = json.loads(Path('.flutter-plugins-dependencies').read_text())
          paths = [Path(p['path'])/'android' for p in deps['plugins']['android']
                   if p['name'] == 'url_launcher_android']
          if len(paths) != 1 or not paths[0].is_dir():
              raise SystemExit('url_launcher_android plugin directory not found')
          scripts = [p for p in (paths[0]/'build.gradle', paths[0]/'build.gradle.kts') if p.exists()]
          if len(scripts) != 1:
              raise SystemExit('Expected one Gradle plugin script')
          with scripts[0].open('a', encoding='utf-8') as out:
              out.write('\n// Scoped CI workaround for upstream JavaDoc lint crash\n'
                        'tasks.matching { it.name == "lintVitalAnalyzeRelease" }.configureEach {\n'
                        '    enabled = false\n'
                        '}\n')
          PY
      - name: Build Android test APK
        run: flutter build apk --release
      - name: Validate actual APK bytes and signature
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools_dir/apksigner" verify --verbose "$apk"
          "$tools_dir/aapt" dump badging "$apk" | grep -F "package: name='com.example.tradelab_flutter'"
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libflutter.so'
          cp "$apk" build/app/outputs/flutter-apk/TradeLab-Flutter-Test-20261116.apk
          (cd build/app/outputs/flutter-apk && sha256sum TradeLab-Flutter-Test-20261116.apk > TradeLab-Flutter-Test-20261116.apk.sha256)
      - name: Publish direct downloadable APK (beta preview only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create tradelab-flutter-test-20261116 \
            "build/app/outputs/flutter-apk/TradeLab-Flutter-Test-20261116.apk#TradeLab-Flutter-Test-20261116.apk" \
            "build/app/outputs/flutter-apk/TradeLab-Flutter-Test-20261116.apk.sha256#TradeLab-Flutter-Test-20261116.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "TradeLab Flutter — Android test 2026-11-16" \
            --notes "TEST ONLY. Flutter code matches main after PR #443; PR #444 is not included. Source-only 145 tests passed earlier. APK structure and signature are verified, but Android installation and launch are NOT confirmed: the preceding emulator attempt failed due to Android emulator startup/ADB broken pipe (not a proven application crash). This preview is signed with a generated debug certificate, not a production release. cTrader OAuth, broker history, Range TradingView parity and performance are unverified."
      - name: Publish build readiness status to GitHub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          if [ "$BUILD_RESULT" = "success" ]; then
            state=success
            description="Flutter APK built, signed and published; device smoke unverified"
          else
            state=failure
            description="Flutter test APK build or publication failed"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="TradeLab-Flutter-Test-APK-20261116" \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/tradelab-flutter-test-20261116"
