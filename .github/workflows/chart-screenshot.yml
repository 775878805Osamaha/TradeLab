name: Capture TradeLab Chart Screenshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator"
      - name: Debug signing key
        run: |
          if [ -f debug.keystore.base64 ]; then base64 -d debug.keystore.base64 > debug.keystore || true; fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Assemble
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Enable hardware virtualization for Android emulator
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM is not available on this runner; do not run an unaccelerated emulator."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Boot emulator and capture actual app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb shell wm size 864x1536
            adb shell wm density 346
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell am start -n com.aistudio.tradelab.vzqrpk/com.example.MainActivity
            mkdir -p screenshots
            sleep 35
            adb shell screencap -p /sdcard/tradelab-35s.png
            adb pull /sdcard/tradelab-35s.png screenshots/tradelab-35s.png
            sleep 65
            adb shell screencap -p /sdcard/tradelab-100s.png
            adb pull /sdcard/tradelab-100s.png screenshots/tradelab-100s.png
            sleep 50
            adb shell screencap -p /sdcard/tradelab-150s.png
            adb pull /sdcard/tradelab-150s.png screenshots/tradelab-150s.png
            # Capture the accessibility hierarchy so bottom-navigation regressions
            # are detectable even when the emulator screenshots look superficially OK.
            adb shell uiautomator dump /sdcard/tradelab-ui.xml
            adb pull /sdcard/tradelab-ui.xml screenshots/tradelab-ui.xml
            adb shell dumpsys activity activities > screenshots/activity-state.txt
            adb logcat -d -t 3000 > screenshots/logcat-tail.txt
            adb shell dumpsys activity processes > screenshots/process-state.txt
            adb shell dumpsys meminfo com.android.systemui > screenshots/systemui-memory.txt
            adb shell dumpsys meminfo com.aistudio.tradelab.vzqrpk > screenshots/tradelab-memory.txt
            adb shell dumpsys activity exit-info com.android.systemui > screenshots/systemui-exits.txt || true
              # Use the real accessibility hierarchy rather than guessing phone coordinates.
              adb shell uiautomator dump /sdcard/tradelab-before-replay.xml
              adb pull /sdcard/tradelab-before-replay.xml screenshots/tradelab-before-replay.xml
              python3 scripts/open_replay_from_ui.py
              sleep 8
              adb shell screencap -p /sdcard/tradelab-replay.png
              adb pull /sdcard/tradelab-replay.png screenshots/tradelab-replay.png
              adb shell uiautomator dump /sdcard/tradelab-replay-ui.xml
              adb pull /sdcard/tradelab-replay-ui.xml screenshots/tradelab-replay-ui.xml
      - name: Install screenshot analysis dependency
        run: python3 -m pip install --user Pillow
      - name: Compare actual screenshot with supplied reference
        run: python3 scripts/compare_chart_reference.py
      - name: Validate captured screen has real candlesticks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          images = [Path("screenshots/tradelab-35s.png"), Path("screenshots/tradelab-100s.png"), Path("screenshots/tradelab-150s.png")]
          for path in images:
              if not path.exists():
                  raise SystemExit(f"Missing screenshot: {path}")
              im = Image.open(path).convert("RGB")
              w, h = im.size
              pixels = im.load()
              teal = red = 0
              # Ignore the header, order buttons and volume bars. Count colored
              # candle bodies/wicks in the middle chart region only.
              for y in range(int(h * 0.18), int(h * 0.70), 3):
                  for x in range(int(w * 0.14), int(w * 0.86), 3):
                      r, g, b = pixels[x, y]
                      if g > r * 1.28 and b > r * 1.12 and g > 75:
                          teal += 1
                      if r > g * 1.55 and r > b * 1.45 and r > 110:
                          red += 1
              print(f"{path.name}: {w}x{h}, candle-color samples teal={teal}, red={red}")
              if path.name.endswith("150s.png") and teal + red < 40:
                  raise SystemExit("No visible candlestick evidence after 150 seconds")
          PY
      - name: Verify four Arabic bottom navigation destinations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("screenshots/tradelab-ui.xml")
          if not path.is_file():
              raise SystemExit("Missing emulator accessibility hierarchy")
          root = ET.parse(path).getroot()
          labels = set()
          for node in root.iter("node"):
              labels.add(node.attrib.get("text", ""))
              labels.add(node.attrib.get("content-desc", ""))
          expected = {"السوق", "الشارت", "النتائج", "الحساب"}
          missing = expected - labels
          print("Found navigation labels:", sorted(expected - missing))
          if missing:
              raise SystemExit("Bottom navigation missing Arabic tabs: " + ", ".join(sorted(missing)))
          PY
      - name: Reject Android system ANR overlays
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for path in sorted(Path("screenshots").glob("tradelab-*.png")):
              im = Image.open(path).convert("RGB")
              w, h = im.size
              # The actual API 30 emulator failure shows a large bright modal
              # covering the dark chart center. Sample a rectangular central area.
              bright = 0
              total = 0
              for y in range(int(h * .38), int(h * .56), 4):
                  for x in range(int(w * .22), int(w * .78), 4):
                      r,g,b = im.getpixel((x,y))
                      total += 1
                      if min(r,g,b) > 225:
                          bright += 1
              ratio = bright / max(1,total)
              print(f"{path.name}: center bright-overlay ratio={ratio:.3f}")
              if ratio > .55:
                  raise SystemExit(f"Potential system ANR or blocking modal in {path.name}")
          PY
      - name: Upload real emulator capture and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradelab-chart-emulator-screenshot
          path: screenshots/
          if-no-files-found: warn
