name: Verify TradeLab Flutter Lab APK (no release)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tradelab-risk-replay-analytics
    paths:
      - flutter_app/**
      - .github/workflows/verify-flutter-lab-apk.yml

permissions:
  contents: read

jobs:
  verify-flutter-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate isolated Android host
        run: flutter create --platforms android --project-name tradelab_flutter . --no-pub
      - name: Configure isolated OAuth callback
        run: python3 tool/configure_android_host.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze all Flutter source
        run: flutter analyze --no-fatal-infos
      - name: Run all unit and widget tests except generated golden snapshot
        # The golden baseline is generated by the preview workflow and should
        # never be silently updated to make a failing comparison pass.
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -maxdepth 1 -name '*_test.dart' \
            ! -name 'golden_test.dart' | sort)
          test "${#tests[@]}" -gt 0
          flutter test "${tests[@]}"
      - name: Verify broker gateway handoff contract
        run: node --test ../vercel-gateway/test/flutter-handoff.test.mjs
      - name: Build candidate APK
        run: flutter build apk --release
      - name: Verify APK integrity and Android signature
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 \
            -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools_dir/apksigner" verify --verbose "$apk"
          "$tools_dir/aapt" dump badging "$apk" \
            | grep -F "package: name='com.example.tradelab_flutter'"
          cp "$apk" build/app/outputs/flutter-apk/TradeLab-Lab-Test.apk
          sha256sum build/app/outputs/flutter-apk/TradeLab-Lab-Test.apk \
            > build/app/outputs/flutter-apk/TradeLab-Lab-Test.apk.sha256
      - name: Install and launch candidate on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            set -eu
            apk="$GITHUB_WORKSPACE/flutter_app/build/app/outputs/flutter-apk/TradeLab-Lab-Test.apk"
            adb install "$apk"
            adb shell monkey -p com.example.tradelab_flutter \
              -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof -s com.example.tradelab_flutter
            adb exec-out screencap -p \
              > "$GITHUB_WORKSPACE/flutter_app/tradelab-lab-android13.png"
            adb logcat -d -b crash \
              > "$GITHUB_WORKSPACE/flutter_app/tradelab-lab-crash.log"
      - name: Upload test-only APK and installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Lab-Test-APK-and-QA
          path: |
            flutter_app/build/app/outputs/flutter-apk/TradeLab-Lab-Test.apk
            flutter_app/build/app/outputs/flutter-apk/TradeLab-Lab-Test.apk.sha256
            flutter_app/tradelab-lab-android13.png
            flutter_app/tradelab-lab-crash.log
          if-no-files-found: warn
