name: Verify cTrader gateway for Flutter

on:
  push:
    branches:
      - main
      - feat/tradelab-flutter-ui-20261108
    paths:
      - vercel-gateway/**
      - .github/workflows/verify-flutter-ctrader-gateway.yml
  pull_request:
    paths:
      - vercel-gateway/**
      - .github/workflows/verify-flutter-ctrader-gateway.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: vercel-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vercel-gateway/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate server entry points
        run: npm run check
      - name: Verify cTrader read-only permissions, history, OAuth and races
        run: npm test
