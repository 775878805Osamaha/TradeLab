name: Verify cTrader gateway for Flutter

# Lightweight authenticated-stub tests for gateway changes, no APK build.
on:
  workflow_dispatch:
  pull_request:
    branches: [test/flutter-all-fixes-20261116]
    paths:
      - 'vercel-gateway/**'
      - '.github/workflows/verify-flutter-ctrader-gateway.yml'
permissions:
  contents: read

jobs:
  read-only-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: vercel-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vercel-gateway/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate server entry points
        run: npm run check
      - name: Verify cTrader read-only permissions, history, OAuth and races
        run: npm test
