name: Build TradeLab Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            echo "APK successfully generated:"
            ls -lh app/build/outputs/apk/debug/*.apk
          else
            echo "Error: No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi

      - name: Upload TradeLab Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
