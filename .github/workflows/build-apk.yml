name: Build TradeLab Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore or Generate Debug Keystore
        run: |
          TARGET_KEYSTORE="${GITHUB_WORKSPACE:-.}/debug.keystore"
          if [ -f "debug.keystore.base64" ]; then
            echo "Attempting to restore debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > "$TARGET_KEYSTORE" 2>/dev/null || base64 -D debug.keystore.base64 > "$TARGET_KEYSTORE" 2>/dev/null || true
          fi
          if [ ! -s "$TARGET_KEYSTORE" ]; then
            echo "Generating standard Android debug keystore at $TARGET_KEYSTORE..."
            keytool -genkeypair -v -keystore "$TARGET_KEYSTORE" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify Debug Keystore
        run: |
          TARGET_KEYSTORE="${GITHUB_WORKSPACE:-.}/debug.keystore"
          test -f "$TARGET_KEYSTORE" || {
            echo "ERROR: Debug keystore not found at $TARGET_KEYSTORE"
            exit 1
          }
          echo "SUCCESS: Debug keystore verified at $TARGET_KEYSTORE"
          ls -lh "$TARGET_KEYSTORE"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Toolchain Diagnostics
        run: |
          echo "================ TOOLCHAIN DIAGNOSTICS ================"
          echo "Java version:"
          java -version
          echo "Gradle & Runner Environment:"
          ./gradlew --version
          echo "======================================================="

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            echo "SUCCESS: APK file exists at $APK_FILE"
            echo "APK file details and size:"
            ls -lh "$APK_FILE"
            ls -l "$APK_FILE"
          else
            echo "ERROR: Expected APK file does not exist at $APK_FILE"
            exit 1
          fi

      - name: Upload TradeLab Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
