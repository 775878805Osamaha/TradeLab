name: TradeLab Flutter UI Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tradelab-flutter-ui-20261108
    paths:
      - flutter_app/**
      - .github/workflows/build-flutter-ui-apk.yml

permissions:
  # A prerelease exposes the APK itself rather than forcing Android users to
  # extract the ZIP wrapper used for GitHub Actions artifacts.
  contents: write

jobs:
  flutter-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate isolated Flutter Android host
        run: flutter create --platforms android --project-name tradelab_flutter . --no-pub
      - name: Preserve TradeLab launcher branding
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            rm -f "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done
          cp -r ../app/src/main/res/mipmap-* android/app/src/main/res/
          cp ../app/src/main/res/drawable/ic_launcher_*.xml android/app/src/main/res/drawable/
          sed -i 's/android:label="tradelab_flutter"/android:label="TradeLab Flutter Preview"/' android/app/src/main/AndroidManifest.xml
      - name: Configure isolated Flutter OAuth callback and internet permission
        run: python3 tool/configure_android_host.py
      - name: Fetch Flutter dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Interaction tests
        run: flutter test test/widget_test.dart test/range_bar_builder_test.dart test/chart_viewport_test.dart test/market_api_test.dart
      - name: Verify native OAuth compatibility
        run: node --test ../vercel-gateway/test/flutter-handoff.test.mjs
      - name: Capture chart design snapshot
        run: flutter test --update-goldens test/golden_test.dart
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Validate installable APK and prepare direct download
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools_dir/apksigner" verify --verbose "$apk"
          "$tools_dir/aapt" dump badging "$apk" | sed -n '1,10p'
          cp "$apk" "build/app/outputs/flutter-apk/TradeLab-Flutter.apk"
          sha256sum "build/app/outputs/flutter-apk/TradeLab-Flutter.apk" \
            > "build/app/outputs/flutter-apk/TradeLab-Flutter.apk.sha256"
      - name: Upload installable Flutter UI preview
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Flutter-UI-Preview-APK
          path: |
            flutter_app/build/app/outputs/flutter-apk/TradeLab-Flutter.apk
            flutter_app/build/app/outputs/flutter-apk/TradeLab-Flutter.apk.sha256
          if-no-files-found: error
      - name: Upload design snapshot
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Flutter-Chart-Snapshot
          path: flutter_app/test/goldens/tradelab_chart_flutter.png
          if-no-files-found: error
      - name: Publish direct APK as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="flutter-preview-${GITHUB_SHA:0:12}"
          gh release create "$tag" \
            "build/app/outputs/flutter-apk/TradeLab-Flutter.apk#TradeLab-Flutter.apk" \
            "build/app/outputs/flutter-apk/TradeLab-Flutter.apk.sha256#TradeLab-Flutter.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TradeLab Flutter Preview ${GITHUB_SHA:0:7}" \
            --notes "Flutter/Dart preview APK, Android debug signed. This build is distinct from the existing Kotlin TradeLab app. cTrader OAuth needs the server gateway update before live broker login will work."
