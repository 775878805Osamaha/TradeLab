name: TradeLab Flutter UI Preview APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - flutter_app/**
      - .github/workflows/build-flutter-ui-apk.yml
  push:
    branches:
      - feat/tradelab-flutter-ui-20261108
    paths:
      - flutter_app/**
      - .github/workflows/build-flutter-ui-apk.yml

permissions:
  # A prerelease exposes the APK itself rather than forcing Android users to
  # extract the ZIP wrapper used for GitHub Actions artifacts.
  contents: write

jobs:
  flutter-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate isolated Flutter Android host
        run: flutter create --platforms android --project-name tradelab_flutter . --no-pub
      - name: Preserve TradeLab launcher branding
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            rm -f "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done
          cp -r ../app/src/main/res/mipmap-* android/app/src/main/res/
          cp ../app/src/main/res/drawable/ic_launcher_*.xml android/app/src/main/res/drawable/
          sed -i 's/android:label="tradelab_flutter"/android:label="TradeLab Flutter Preview"/' android/app/src/main/AndroidManifest.xml
      - name: Configure isolated Flutter OAuth callback and internet permission
        run: python3 tool/configure_android_host.py
      - name: Fetch Flutter dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Interaction tests
        run: flutter test test/widget_test.dart test/chart_short_position_test.dart test/range_bar_builder_test.dart test/chart_viewport_test.dart test/chart_annotations_test.dart test/chart_line_geometry_test.dart test/candle_prefix_test.dart test/results_connection_test.dart test/market_api_test.dart test/paper_ledger_test.dart test/paper_journal_controller_test.dart test/paper_trade_service_test.dart
      - name: Verify native OAuth compatibility
        run: node --test ../vercel-gateway/test/flutter-handoff.test.mjs
      - name: Capture chart design snapshot
        run: flutter test --update-goldens test/golden_test.dart
      - name: Verify eight-handle price rectangle and render isolated preview
        run: flutter test --update-goldens test/chart_price_rectangle_test.dart
      - name: Verify 21 chart-kind cards and capture selected-candles sheet
        run: flutter test --update-goldens test/chart_type_sheet_test.dart
      - name: Verify Gann, trend and general drawing catalogs, actions, RTL and goldens
        run: flutter test --update-goldens test/drawing_tools_sheet_test.dart
      - name: Verify PROMPT 06 analysis hub layout, actions and golden
        run: flutter test --update-goldens test/analysis_hub_sheet_test.dart
      - name: Build optimized Flutter preview APK
        # Flutter's generated Android host signs this preview using its
        # ephemeral debug certificate; this is NOT a Play Store release.
        run: flutter build apk --release
      - name: Validate installable APK and prepare direct download
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools_dir/apksigner" verify --verbose "$apk"
          "$tools_dir/aapt" dump badging "$apk" | sed -n '1,10p'
          "$tools_dir/aapt" dump badging "$apk" | grep -F "package: name='com.example.tradelab_flutter'"
          cp "$apk" "build/app/outputs/flutter-apk/TradeLab-Flutter.apk"
          sha256sum "build/app/outputs/flutter-apk/TradeLab-Flutter.apk" \
            > "build/app/outputs/flutter-apk/TradeLab-Flutter.apk.sha256"
      - name: Upload installable Flutter UI preview
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Flutter-UI-Preview-APK
          path: |
            flutter_app/build/app/outputs/flutter-apk/TradeLab-Flutter.apk
            flutter_app/build/app/outputs/flutter-apk/TradeLab-Flutter.apk.sha256
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            set -eu
            adb devices
            adb install "$GITHUB_WORKSPACE/flutter_app/build/app/outputs/flutter-apk/TradeLab-Flutter.apk"
            adb shell monkey -p com.example.tradelab_flutter -c android.intent.category.LAUNCHER 1
            # The release app can remain on its Android launch splash while the
            # emulator finishes its first Flutter engine startup. Allow enough
            # time for the actual chart shell to render before taking evidence.
            sleep 25
            adb shell pidof -s com.example.tradelab_flutter
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/flutter_app/build/tradelab_emulator.png"
            # One command: the emulator runner executes script lines separately.
            python3 "$GITHUB_WORKSPACE/flutter_app/tool/capture_chart_type_sheet.py" "$GITHUB_WORKSPACE/flutter_app/build/tradelab_chart_type_sheet.png"
            python3 "$GITHUB_WORKSPACE/flutter_app/tool/capture_drawing_tools_sheet.py" "$GITHUB_WORKSPACE/flutter_app/build/tradelab_drawing_tools_sheet.png"
            python3 "$GITHUB_WORKSPACE/flutter_app/tool/capture_trend_drawing_tools_sheet.py" "$GITHUB_WORKSPACE/flutter_app/build/tradelab_trend_drawing_tools_sheet.png"
            python3 "$GITHUB_WORKSPACE/flutter_app/tool/capture_analysis_hub_sheet.py" "$GITHUB_WORKSPACE/flutter_app/build/tradelab_analysis_hub_sheet.png"
            python3 "$GITHUB_WORKSPACE/flutter_app/tool/capture_general_drawing_tools_sheet.py" "$GITHUB_WORKSPACE/flutter_app/build/tradelab_general_drawing_tools_sheet.png"
      - name: Upload real Android emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Flutter-Android-Emulator-Screenshot
          path: flutter_app/build/tradelab_emulator.png
          if-no-files-found: error
      - name: Upload design snapshot
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Flutter-Chart-Snapshot
          path: flutter_app/test/goldens/tradelab_chart_flutter.png
          if-no-files-found: error
      - name: Upload isolated price rectangle screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Price-Rectangle-Component-Preview
          path: flutter_app/test/goldens/selected_price_rectangle.png
          if-no-files-found: error
      - name: Upload 21-card chart type sheet golden
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Chart-Type-Selected-Candles-Golden
          path: flutter_app/test/goldens/chart_type_sheet_selected_candles.png
          if-no-files-found: error
      - name: Upload Android chart type sheet screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Android-Chart-Type-Sheet
          path: flutter_app/build/tradelab_chart_type_sheet.png
          if-no-files-found: warn
      - name: Upload Gann Fibonacci drawing catalog golden
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Gann-Fibonacci-Drawing-Catalog-Golden
          path: flutter_app/test/goldens/gann_fibonacci_drawing_tools.png
          if-no-files-found: error
      - name: Upload real Android drawing tools screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Android-Gann-Fibonacci-Drawings
          path: flutter_app/build/tradelab_drawing_tools_sheet.png
          if-no-files-found: error
      - name: Upload PROMPT 05 trend drawing tools golden
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Trend-Drawing-Catalog-Golden
          path: flutter_app/test/goldens/trend_drawing_tools.png
          if-no-files-found: error
      - name: Upload real Android trend drawing screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Android-Trend-Drawings
          path: flutter_app/build/tradelab_trend_drawing_tools_sheet.png
          if-no-files-found: error
      - name: Upload PROMPT 06 analysis hub golden
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Analysis-Hub-Golden
          path: flutter_app/test/goldens/analysis_hub_sheet.png
          if-no-files-found: error
      - name: Upload real Android analysis hub screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Android-Analysis-Hub
          path: flutter_app/build/tradelab_analysis_hub_sheet.png
          if-no-files-found: error
      - name: Upload PROMPT 07 general drawing commands golden
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-General-Drawing-Commands-Golden
          path: flutter_app/test/goldens/general_drawing_actions.png
          if-no-files-found: error
      - name: Upload actual Android PROMPT 07 general tools screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Android-General-Drawing-Commands
          path: flutter_app/build/tradelab_general_drawing_tools_sheet.png
          if-no-files-found: error
      - name: Publish direct APK as GitHub prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="flutter-preview-${GITHUB_SHA:0:12}"
          gh release create "$tag" \
            "build/app/outputs/flutter-apk/TradeLab-Flutter.apk#TradeLab-Flutter.apk" \
            "build/app/outputs/flutter-apk/TradeLab-Flutter.apk.sha256#TradeLab-Flutter.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TradeLab Flutter Preview ${GITHUB_SHA:0:7}" \
            --notes "Flutter/Dart optimized AOT preview APK, signed with an ephemeral debug certificate (not Play Store signing). Tested for install and launch on an Android 13 emulator. This is separate from the Kotlin TradeLab app; cTrader OAuth needs the gateway deployment before broker login works."
