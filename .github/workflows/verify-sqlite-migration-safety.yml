name: Verify SQLite migration safety (test only)
on:
  workflow_dispatch:
  pull_request:
    branches: [test/flutter-all-fixes-20261116]
    paths:
      - 'flutter_app/test/market_candle_migration_safety_gate_test.dart'
      - '.github/workflows/verify-sqlite-migration-safety.yml'
permissions:
  contents: read
jobs:
  archive-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run safety gate against production migration
        run: |
          mkdir -p build/sqlite_migration_gate
          flutter test --reporter expanded --file-reporter json:build/sqlite_migration_gate/tests.jsonl test/market_candle_migration_safety_gate_test.dart
      - name: Upload actual gate measurements even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-migration-safety-${{ github.run_id }}
          path: flutter_app/build/sqlite_migration_gate/
