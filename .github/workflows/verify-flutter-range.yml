name: Verify TradeLab Flutter Range History

# Lightweight quality gate: no Gradle release build, emulator or APK.
# Runs only for Flutter changes in PRs, and on explicit manual dispatch.
on:
  workflow_dispatch:
  pull_request:
    branches: [integration/pine-v10, main, test/flutter-all-fixes-20261116, feat/pine-stage1-instance-safe-runtime-20261123, feat/pine-v10-02-semantic-registry-20261125]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/verify-flutter-range.yml'
permissions:
  contents: read

# A new PR commit supersedes previous quick-test attempts.
concurrency:
  group: tradelab-range-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-flutter-range:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - name: Verify original TradingView capture SHA-256
        working-directory: .
        run: echo '64b557c209f44c387a127bdf213703d4858fa3d62305711a12630713422221b3  flutter_app/test/fixtures/tradingview/4_5778588908598075071.csv' | sha256sum --check
      - name: Verify unmodified TradingView V2 capture SHA-256
        working-directory: .
        run: echo '6a052a535dc4bf77d3687a10446e9572bdf523a3bc80e2fe728a2c290899da7f  flutter_app/test/fixtures/tradingview/pine-logs-TradeLab Reference Logs V2.csv' | sha256sum --check
      - name: Verify independent long OHLCV fixture reproducibility
        working-directory: .
        run: node tools/pine/generate_stage3b_reference.cjs --check
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Flutter/Dart widget and unit tests need no generated Android host,
      # Gradle, Java toolchain, emulator or APK signing.
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter
        run: flutter analyze --no-fatal-infos
      - name: Prepare machine-readable test evidence
        run: mkdir -p build/pine_audit
      - name: Verify historical tick archive and chart interactions
        run: |
          flutter test --reporter expanded --file-reporter json:build/pine_audit/main.jsonl test/range_older_page_test.dart \
            test/range_bid_page_verifier_test.dart \
            test/range_older_page_scanner_test.dart \
            test/range_startup_loader_test.dart \
            test/range_history_fill_policy_test.dart \
            test/range_tick_store_test.dart \
            test/range_verified_bid_window_slice_test.dart \
            test/widget_test.dart \
            test/candle_prefix_test.dart \
            test/range_tick_rollforward_test.dart \
            test/range_bar_timeline_test.dart \
            test/range_size_reuse_test.dart \
            test/range_refresh_retention_test.dart \
            test/range_refresh_retention_widget_test.dart \
