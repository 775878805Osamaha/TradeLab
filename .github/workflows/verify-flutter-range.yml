            test/chart_frame_profiler_test.dart
      # The catalog test file also contains optional screenshot-golden
      # comparisons whose baseline PNG files are NOT checked into this repo.
      # Exercise the new Long/Short catalog behavior explicitly here rather
      # than falsely failing CI on unrelated missing golden assets. Preserve
      # the original visual tests for environments with their true baselines.
      - name: Verify Long and Short catalog selection without missing goldens
        run: flutter test --reporter expanded --file-reporter json:build/pine_audit/extra_1.jsonl test/drawing_tools_sheet_test.dart --plain-name 'risk/reward drawings support both real long and short tools'
      - name: Verify Crossline catalog choice without missing screenshot goldens
        run: flutter test --reporter expanded --file-reporter json:build/pine_audit/extra_2.jsonl test/drawing_tools_sheet_test.dart --plain-name 'crossline is enabled as a single-touch trend drawing'
      - name: Verify Info Line selectable without unrelated missing Golden files
        run: flutter test --reporter expanded --file-reporter json:build/pine_audit/extra_3.jsonl test/drawing_tools_sheet_test.dart --plain-name 'Info Line is selectable and trend-only, without false Gann support'
      - name: Verify Trend Angle is a selectable source drawing without missing Goldens
        run: flutter test --reporter expanded --file-reporter json:build/pine_audit/extra_4.jsonl test/drawing_tools_sheet_test.dart --plain-name 'Trend Angle is selectable from the native two-anchor catalog'
      # The original bug appears on phones whose local timezone differs
      # from the selected chart timezone (e.g. New York on a Yemen device).
      - name: Verify chart weekdays under Yemen device timezone
        env:
          TZ: Asia/Aden
        run: flutter test --reporter expanded --file-reporter json:build/pine_audit/extra_5.jsonl test/chart_scale_settings_test.dart
      - name: Summarize actual test events and Pine diagnostics
        if: ${{ always() }}
        run: python3 ../tools/pine/summarize_ci_audit.py
      - name: Upload full Pine diagnostic and test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pine-diagnostic-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: flutter_app/build/pine_audit/
          if-no-files-found: error
          retention-days: 30
