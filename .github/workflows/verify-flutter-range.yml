name: Verify TradeLab Flutter Range History

# Lightweight quality gate: no Gradle release build, emulator or APK.
# Runs only for Flutter changes in PRs, and on explicit manual dispatch.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, test/flutter-all-fixes-20261116]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/verify-flutter-range.yml'
permissions:
  contents: read

# A new PR commit supersedes previous quick-test attempts.
concurrency:
  group: tradelab-range-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-flutter-range:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Flutter/Dart widget and unit tests need no generated Android host,
      # Gradle, Java toolchain, emulator or APK signing.
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter
        run: flutter analyze --no-fatal-infos
      - name: Verify historical tick archive and chart interactions
        run: |
          flutter test test/range_older_page_test.dart \
            test/range_bid_page_verifier_test.dart \
            test/range_older_page_scanner_test.dart \
            test/range_startup_loader_test.dart \
            test/range_history_fill_policy_test.dart \
            test/range_tick_store_test.dart \
            test/range_verified_bid_window_slice_test.dart \
            test/widget_test.dart \
            test/candle_prefix_test.dart \
            test/range_tick_rollforward_test.dart \
            test/range_bar_timeline_test.dart \
            test/range_live_bid_delta_test.dart \
            test/range_drawing_rebase_search_test.dart \
            test/range_bar_builder_test.dart \
            test/range_bar_validation_test.dart \
            test/chart_viewport_test.dart \
            test/chart_120k_viewport_workload_test.dart \
            test/chart_price_scale_cache_test.dart \
            test/chart_axis_ticks_test.dart \
            test/chart_price_text_formatter_test.dart \
            test/chart_axis_source_labels_test.dart \
            test/chart_visible_highlow_reuse_test.dart \
            test/chart_ohlc_inspector_test.dart \
            test/chart_crosshair_time_label_test.dart \
            test/chart_visible_sma_test.dart \
            test/chart_double_tap_guide_test.dart \
            test/chart_paint_only_pan_test.dart \
            test/chart_frame_profiler_test.dart \
            test/chart_load_profiler_test.dart \
            test/chart_text_layout_cache_test.dart \
            test/chart_rectangle_label_cache_test.dart \
            test/chart_rectangle_visibility_timezone_test.dart \
            test/chart_timeframe_catalog_test.dart \
            test/chart_panel_settings_test.dart \
            test/chart_symbol_settings_test.dart \
            test/chart_mobile_controls_test.dart \
            test/chart_range_initial_preset_test.dart \
            test/chart_focus_mode_test.dart \
            test/markets_chart_navigation_test.dart \
            test/watchlist_favorites_sqlite_test.dart \
            test/watchlist_favorites_widget_test.dart \
