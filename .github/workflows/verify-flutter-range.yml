name: Verify TradeLab Flutter Range History

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/verify-flutter-range.yml'

permissions:
  contents: read

# A new main-branch commit supersedes the prior verification run.
concurrency:
  group: tradelab-range-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-flutter-range:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host
        run: flutter create --platforms android --project-name tradelab_flutter . --no-pub
      - name: Configure OAuth callback and internet permission
        run: python3 tool/configure_android_host.py
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter
        run: flutter analyze --no-fatal-infos
      - name: Verify historical tick archive and chart interactions
        run: |
          flutter test test/range_tick_store_test.dart \
            test/range_tick_rollforward_test.dart \
            test/range_bar_timeline_test.dart \
            test/range_bar_builder_test.dart \
            test/chart_viewport_test.dart \
            test/chart_annotations_test.dart \
            test/ctrader_candle_stitcher_test.dart \
            test/market_api_test.dart
      - name: Build Android release preview (no publishing)
        run: flutter build apk --release
      - name: Validate built APK archive
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -t build/app/outputs/flutter-apk/app-release.apk >/dev/null
      - name: Upload test APK for manual device validation
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Range-Verification-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            set -eu
            adb install "$GITHUB_WORKSPACE/flutter_app/build/app/outputs/flutter-apk/app-release.apk"
            adb shell monkey -p com.example.tradelab_flutter -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof -s com.example.tradelab_flutter
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/flutter_app/build/tradelab_range_emulator.png"
      - name: Upload Android emulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Range-Android13-Screenshot
          path: flutter_app/build/tradelab_range_emulator.png
          if-no-files-found: error
