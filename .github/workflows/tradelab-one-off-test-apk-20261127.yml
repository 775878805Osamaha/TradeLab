name: TradeLab one-off isolated Test APK
on:
  push:
    branches: [qa/pine-one-off-20261127]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdf4b5da726b69d69b74d69e4611e198ddae62f9
          persist-credentials: false
      - name: Exact approved base
        run: test "$(git rev-parse HEAD)" = "fdf4b5da726b69d69b74d69e4611e198ddae62f9"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate isolated debug host
        working-directory: flutter_app
        run: |
          flutter create --platforms android --project-name tradelab_flutter . --no-pub
          python3 tool/configure_android_host.py
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as E
          import re
          p=Path('android/app/build.gradle.kts')
          if not p.exists(): p=Path('android/app/build.gradle')
          s=p.read_text()
          s,n=re.subn(r'(applicationId\s*(?:=\s*)?["\x27])com\.example\.tradelab_flutter(["\x27])',r'\g<1>com.example.tradelab_flutter.pinetest20261127\2',s)
          assert n==1
          p.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml')
          E.register_namespace('android','http://schemas.android.com/apk/res/android')
          ns='{http://schemas.android.com/apk/res/android}'
          t=E.parse(m); root=t.getroot(); app=root.find('application')
          assert app is not None
          app.set(ns+'label','TradeLab Test')
          app.set(ns+'allowBackup','false')
          # Avoid claiming the installed production Flutter app's OAuth link.
          for act in app.findall('activity'):
              for intent in list(act.findall('intent-filter')):
                  if any(d.get(ns+'scheme')=='tradelabflutter' for d in intent.findall('data')):
                      act.remove(intent)
          assert root.get(ns+'sharedUserId') is None
          t.write(m,encoding='utf-8',xml_declaration=True)
          print(m.read_text())
          PY
          flutter pub get
      - name: Build debug APK (no production key)
        working-directory: flutter_app
        run: flutter build apk --debug
      - name: Verify actual APK package label and signature
        working-directory: flutter_app
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p build/qa-artifact
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee build/qa-artifact/signature.txt
          grep -F 'CN=Android Debug' build/qa-artifact/signature.txt
          "$tools/aapt" dump badging "$apk" | tee build/qa-artifact/badging.txt
          grep -F "package: name='com.example.tradelab_flutter.pinetest20261127'" build/qa-artifact/badging.txt
          grep -F "application-label:'TradeLab Test'" build/qa-artifact/badging.txt
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > build/qa-artifact/manifest.txt
          ! grep -F 'sharedUserId' build/qa-artifact/manifest.txt
          ! grep -F 'tradelabflutter' build/qa-artifact/manifest.txt | grep -F 'scheme'
          cp "$apk" build/qa-artifact/TradeLab-Test.apk
          (cd build/qa-artifact && sha256sum TradeLab-Test.apk > TradeLab-Test.apk.sha256)
          printf '%s\n' "$(git rev-parse HEAD)" > build/qa-artifact/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TradeLab-Test-APK-20261127
          retention-days: 14
          if-no-files-found: error
          path: flutter_app/build/qa-artifact/
